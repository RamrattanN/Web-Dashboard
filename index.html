<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard</title>
  <!--
  WebDashboard v1.4.9
  Author: Nilesh Ramrattan
  Solution concept and implementation assisted by ChatGPT (OpenAI)
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --card-bg: #ffffff;
      --card-fg: #0f172a;
      --muted: #475569;
      --accent: #2563eb;
      --accent-2: #0ea5e9;
      --ring: rgba(37,99,235,0.35);
      --shadow: 0 10px 30px rgba(2,6,23,0.25);
      --tile-gap: 14px;
      --tile-radius: 16px;
      --tile-pad: 14px;
      --tile-width: 220px;
      --cols: 10;
    }
    *{ box-sizing: border-box; }
    html, body{ height: 100%; }
    body{
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color: var(--card-fg);
      background: #111827;
    }
    .wallpaper{ position: fixed; inset: 0; z-index: -2; background-size: cover; background-position: center; filter: saturate(1.05); }
    .tint{ position: fixed; inset: 0; z-index: -1; background: radial-gradient(ellipse at 50% 30%, rgba(0,0,0,0.18), rgba(0,0,0,0.55)); }

    .top-actions{ position: fixed; top: 16px; left: 16px; z-index: 30; display: flex; gap: 8px; align-items: center; }
    .btn{ appearance: none; border: none; background: var(--card-bg); color: var(--card-fg); padding: 8px 12px; border-radius: 10px; cursor: pointer; box-shadow: var(--shadow); font-weight: 500; }
    .btn.primary{ background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white; box-shadow: 0 10px 24px var(--ring); }
    .fab-settings{ position: fixed; top: 16px; right: 16px; z-index: 30; appearance: none; border: none; padding: 10px 14px; border-radius: 12px; background: var(--card-bg); color: var(--card-fg); box-shadow: var(--shadow); font-weight: 600; cursor: pointer; }

    .wrap{ min-height: 100%; display: grid; grid-template-rows: auto auto 1fr; gap: 18px; }
    header{ padding: 140px 24px 0; display: grid; gap: 20px; justify-items: center; position: relative; }
    .logo{ font-weight: 600; letter-spacing: .5px; color: white; text-shadow: 0 2px 10px rgba(0,0,0,.35); font-size: clamp(34px, 5.6vw, 64px); max-width: min(90vw, 1200px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; outline: none; cursor: text; margin-bottom: 18px; }

    .search-bar, .search-row-2{ width: min(1200px, 92vw); display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .search{ display: grid; grid-template-columns: auto 1fr auto auto auto; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 14px; background: var(--card-bg); box-shadow: var(--shadow); }
    .search input{ border: none; outline: none; background: transparent; padding: 8px; font-size: 16px; color: var(--card-fg); }
    .search .engine{ font-weight: 600; color: var(--muted); padding: 6px 10px; border-radius: 10px; background: rgba(30,41,59,0.06); }
    .icon-btn{ border: none; background: transparent; cursor: pointer; width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; }
    .icon-btn:hover{ background: rgba(30,41,59,0.08); }
    .icon{ font-size: 18px; opacity: .85; }

    main{ display: grid; place-items: center; }
    .grid-wrap{ width: min(1400px, 96vw); }
    .group-bar{ display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 2px; justify-content: center; }
    .pill{ padding: 6px 10px; border-radius: 999px; background: rgba(255,255,255,.85); cursor: pointer; font-weight: 600; }
    .pill.active{ background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white; }

    .grid{ display: grid; grid-template-columns: repeat(var(--cols), var(--tile-width)); gap: var(--tile-gap); justify-content: center; transition: grid-template-columns 120ms ease; }
    .card{ width: var(--tile-width); background: var(--card-bg); border-radius: var(--tile-radius); box-shadow: var(--shadow);
      padding: var(--tile-pad); display: grid; grid-template-columns: 44px 1fr auto; grid-template-rows: auto auto; gap: 8px 12px; align-items: center;
      position: relative; transition: transform 120ms ease, box-shadow 120ms ease;
      touch-action: none;
      user-select: none;
      cursor: grab;
    }
    .card.locked{ cursor: default; }
    .card.dragging{ opacity: .9; box-shadow: 0 12px 28px rgba(2,6,23,0.35); cursor: grabbing; }
    .drag-layer{ position: fixed; z-index: 80; pointer-events: none; }
    .placeholder{
      border-radius: var(--tile-radius);
      min-height: 86px;
      background: linear-gradient(135deg, rgba(255,255,255,0.65), rgba(236,243,255,0.8));
      box-shadow: inset 0 0 0 3px rgba(99,102,241,0.45);
      animation: pulse 1.2s ease-in-out infinite;
      width: var(--tile-width);
    }
    @keyframes pulse{ 0%{ filter: brightness(1); } 50%{ filter: brightness(1.07); } 100%{ filter: brightness(1); } }

    .favicon{ width: 44px; height: 44px; border-radius: 12px; background: #e2e8f0; display: grid; place-items: center; overflow: hidden; grid-column: 1; grid-row: 1; }
    .favicon img{ width: 100%; height: 100%; object-fit: cover; }
    .tile-letter{ font-weight: 800; color: #1e293b; }
    .title{ font-weight: 700; line-height: 1.25; grid-column: 2; grid-row: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .desc{ color: var(--muted); font-size: 13px; line-height: 1.2; grid-column: 1 / -1; grid-row: 2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }

    .more{ opacity: .0; transition: opacity .15s ease; grid-column: 3; grid-row: 1; }
    .card:hover .more{ opacity: .95; }
    .more .icon-btn{ width: 28px; height: 28px; }

    .menu{ position: absolute; top: 48px; right: 10px; background: white; border-radius: 12px; box-shadow: var(--shadow); display: none; min-width: 220px; padding: 6px; z-index: 50; }
    .menu.open{ display: block; }
    .menu button{ width: 100%; text-align: left; border: none; background: transparent; padding: 10px; border-radius: 8px; cursor: pointer; }
    .menu button:hover{ background: rgba(15,23,42,0.06); }

    dialog{ border: none; border-radius: 18px; width: min(650px, 92vw); padding: 0; overflow: hidden; box-shadow: var(--shadow); }
    .sheet{ background: white; padding: 18px; display: grid; gap: 12px; }
        .actions-row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
        .actions-right{display:flex;gap:10px}
        .version-left{font-weight:700;color:#0f172a;background:rgba(37,99,235,.08);padding:8px 12px;border-radius:10px}
    .sheet h3{ margin: 0; }
    .field{ display: grid; gap: 6px; }
    .field input, .field textarea, .field select{ width: 100%; border: 1px solid #cbd5e1; border-radius: 10px; padding: 10px 12px; font-size: 14px; }
    .row{ display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .sheet .actions{ display: flex; justify-content: flex-end; gap: 10px; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="wallpaper" id="wallpaper"></div>
  <div class="tint" id="tint"></div>

  <div class="top-actions">
    <button class="btn primary" id="addBtn">Add link</button>
    <button class="btn" id="importBtn">Import</button>
    <button class="btn" id="exportBtn">Export</button>
  </div>
  <button class="fab-settings" id="settingsBtn">Settings</button>

  <div class="wrap">
    <header>
      <div class="logo" id="logo" contenteditable="true" spellcheck="false" title="Click to edit">Dashboard</div>

      <div class="search-bar">
        <form class="search" id="googleForm" action="https://www.google.com/search" method="GET">
          <span class="engine">Google</span>
          <input name="q" type="text" placeholder="Search Google" autocomplete="off" />
          <button class="icon-btn" type="button" title="Voice search" id="gMic"><span class="icon">🎤</span></button>
          <button class="icon-btn" type="button" title="Search by image" id="gImg"><span class="icon">🖼️</span></button>
          <button class="icon-btn" type="button" title="AI companion" id="gAI"><span class="icon">✨</span></button>
        </form>

        <form class="search" id="bingForm" action="https://www.bing.com/search" method="GET">
          <span class="engine">Bing</span>
          <input name="q" type="text" placeholder="Search Bing" autocomplete="off" />
          <button class="icon-btn" type="button" title="Voice search" id="bMic"><span class="icon">🎤</span></button>
          <button class="icon-btn" type="button" title="Search by image" id="bImg"><span class="icon">🖼️</span></button>
          <button class="icon-btn" type="button" title="AI companion" id="bAI"><span class="icon">✨</span></button>
        </form>
      </div>

      <div class="search-row-2">
        <form class="search" id="ddgForm" action="https://duckduckgo.com/" method="GET">
          <span class="engine">DuckDuckGo</span>
          <input name="q" type="text" placeholder="Search DuckDuckGo" autocomplete="off" />
          <button class="icon-btn" type="button" title="Voice search" id="dMic"><span class="icon">🎤</span></button>
          <button class="icon-btn" type="button" title="Image search not supported here" disabled><span class="icon">🖼️</span></button>
          <button class="icon-btn" type="button" title="AI companion (Perplexity)" id="dAI"><span class="icon">✨</span></button>
        </form>

        <form class="search" id="pxForm" action="https://www.perplexity.ai/search" method="GET" target="_blank">
          <span class="engine">Perplexity</span>
          <input name="q" type="text" placeholder="Ask Perplexity" autocomplete="off" />
          <button class="icon-btn" type="button" title="Voice input" id="pMic"><span class="icon">🎤</span></button>
          <button class="icon-btn" type="button" title="Image search not supported" disabled><span class="icon">🖼️</span></button>
          <button class="icon-btn" type="button" title="AI companion already on" disabled><span class="icon">✨</span></button>
        </form>
      </div>

      <div class="muted">Tip: press Enter to search.  Drag to reorder.  Use the ⋮ on hover or right click for actions.</div>
    </header>

    <main>
      <div class="grid-wrap">
        <div class="group-bar" id="groupBar"></div>
        <div class="grid" id="grid"></div>
      </div>
    </main>
  </div>

  <!-- Add/Edit link dialog -->
  <dialog id="linkDialog">
    <form method="dialog" class="sheet" id="linkForm">
      <h3 id="linkDialogTitle">Add link</h3>
      <div class="field">
        <label>URL</label>
        <input id="urlInput" type="url" placeholder="https://example.com" required />
      </div>
      <div class="row">
        <div class="field">
          <label>Title</label>
          <input id="titleInput" type="text" placeholder="Example" />
        </div>
        <div class="field">
          <label>Description</label>
          <input id="descInput" type="text" placeholder="Short description" />
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label>Group (optional)</label>
          <input id="groupInput" type="text" placeholder="Work, Personal, Finance" />
        </div>
        <div class="field">
          <label>Custom icon URL (optional)</label>
          <input id="iconInput" type="url" placeholder="https://.../logo.png" />
        </div>
      </div>
      <div class="actions">
        <button class="btn" value="cancel">Cancel</button>
        <button class="btn primary" id="saveLinkBtn" value="default">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Settings dialog -->
  <dialog id="settingsDialog">
    <form method="dialog" class="sheet" id="settingsForm">
      <h3>Settings</h3>
      <div class="row">
        <div class="field">
          <label>Columns per row (max)</label>
          <input id="colsMax" type="number" min="3" max="12" value="10" />
        </div>
        <div class="field">
          <label>Tile width (px)</label>
          <input id="tileWidth" type="number" min="160" max="300" value="220" />
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label>Lock layout (disable drag)</label>
          <select id="lockLayout">
            <option value="no">No</option>
            <option value="yes">Yes</option>
          </select>
        </div>
        <div class="field">
          <label>Monthly backup reminder</label>
          <select id="backupRemind">
            <option value="yes">Yes</option>
            <option value="no">No</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Wallpaper mode</label>
        <select id="wallpaperMode">
          <option value="static">Static image URL</option>
          <option value="local">Local image file</option>
          <option value="unsplash">Unsplash keyword daily</option>
          <option value="bing">Bing daily</option>
          <option value="none">Solid color</option>
        </select>
      </div>
      <div class="row">
        <div class="field">
          <label>Image URL or keyword</label>
          <input id="wallpaperValue" type="text" placeholder="https://...  or  mountains" />
        </div>
        <div class="field">
          <label>Solid color (for Solid color mode)</label>
          <input id="wallpaperColor" type="color" value="#0b1120" />
        </div>
      </div>
      <div class="field">
        <label>Upload local image</label>
        <input id="wallpaperFile" type="file" accept="image/*" />
      </div>
      <div class="row">
        <div class="field">
          <label>Maximum tiles to show</label>
          <input id="maxTiles" type="number" min="1" max="200" value="60" />
        </div>
        <div class="field">
          <label>Show descriptions on tiles</label>
          <select id="showDesc">
            <option value="yes">Yes</option>
            <option value="no">No</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label>Default group filter</label>
          <input id="defaultGroup" type="text" placeholder="All" />
        </div>
        <div class="field">
          <label>Show secondary search row</label>
          <select id="showExtraSearch">
            <option value="yes">Yes</option>
            <option value="no">No</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label>Layout density</label>
          <select id="layout">
            <option value="compact">Compact</option>
            <option value="cozy" selected>Cozy</option>
            <option value="spacious">Spacious</option>
          </select>
        </div>
        <div class="field">
          <label>AI companion default</label>
          <select id="aiCompanionDefault">
            <option value="off">Off</option>
            <option value="on">On</option>
          </select>
        </div>
      </div>
      <div class="actions">
        <button class="btn" value="cancel">Close</button>
        <button class="btn primary" id="saveSettingsBtn" value="default">Save</button>
      </div>
    </form>
  </dialog>

  <input id="importFile" type="file" accept="application/json" hidden />

  <script>
    const LS_KEY = 'startpage.links.v1';
    const ST_KEY = 'startpage.settings.v1';
    const IC_KEY = 'startpage.iconcache.v1';
    const APP_NAME='WebDashboard';
    const VERSION='v1.4.9';
    const grid = document.getElementById('grid');
    const groupBar = document.getElementById('groupBar');
    const logo = document.getElementById('logo');

    function getLinks(){ try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; } catch { return []; } }
    function setLinks(arr){ localStorage.setItem(LS_KEY, JSON.stringify(arr)); }
    function getSettings(){
      const defaults = {
        // Default to Bing daily so first-run shows a wallpaper immediately
        mode:'bing', value:'en-US', color:'#0b1120',
        maxTiles:60, showDesc:'yes', groupFilter:'All', showExtraSearch:'yes',
        layout:'cozy', aiDefault:'off', title:'Dashboard',
        colsMax: 10, tileWidth: 220, lockLayout: 'no'
      };
      try { return Object.assign(defaults, JSON.parse(localStorage.getItem(ST_KEY) || '{}')); } catch { return defaults; }
    }
    function setSettings(obj){ localStorage.setItem(ST_KEY, JSON.stringify(obj)); }
    function getIconCache(){ try { return JSON.parse(localStorage.getItem(IC_KEY)) || {}; } catch { return {}; } }
    function setIconCache(map){ localStorage.setItem(IC_KEY, JSON.stringify(map)); }

    function domainFromUrl(u){ try { return new URL(u).hostname; } catch { return ''; } }
    function originFromUrl(u){ try { const x = new URL(u); return x.origin; } catch { return ''; } }

    function iconSourcesFor(u){
      const host = domainFromUrl(u);
      const origin = originFromUrl(u);
      const paths = [`${origin}/favicon.ico`, `${origin}/favicon-32x32.png`, `${origin}/favicon-64x64.png`, `${origin}/favicon-96x96.png`, `${origin}/apple-touch-icon.png`, `${origin}/apple-touch-icon-precomposed.png`];
      const services = [`https://www.google.com/s2/favicons?domain=${host}&sz=128`, `https://icons.duckduckgo.com/ip3/${host}.ico`, `https://logo.clearbit.com/${host}`, `https://api.faviconkit.com/${host}/128`, `https://icon.horse/icon/${host}`];
      return [...paths, ...services];
    }

    function resolveIcon(u, imgEl, onFail){
      const host = domainFromUrl(u);
      const cache = getIconCache();
      if (cache[host]){
        imgEl.referrerPolicy = 'no-referrer';
        imgEl.src = cache[host];
        imgEl.onerror = () => { delete cache[host]; setIconCache(cache); chain(); };
        return;
      }
      chain();
      function chain(){
        const candidates = iconSourcesFor(u);
        let i = 0;
        imgEl.referrerPolicy = 'no-referrer';
        imgEl.crossOrigin = 'anonymous';
        imgEl.onload = () => { const c = getIconCache(); c[host] = imgEl.currentSrc || imgEl.src; setIconCache(c); };
        imgEl.onerror = function next(){ if (i >= candidates.length){ if (onFail) onFail(); return; } imgEl.src = candidates[i++]; };
        imgEl.src = candidates[i++];
      }
    }

    function render(){
      const links = getLinks();
      const st = getSettings();

      applyLayout(st.layout);
      applyGridSizing();
      logo.textContent = st.title || 'Dashboard';
      renderGroupBar(links, st.groupFilter);

      const filtered = st.groupFilter && st.groupFilter !== 'All' ? links.filter(l => (l.group||'').toLowerCase() === st.groupFilter.toLowerCase()) : links;
      grid.innerHTML = '';
      filtered.slice(0, Number(st.maxTiles||60)).forEach((item) => grid.appendChild(cardEl(item, links.indexOf(item))));

      applyWallpaper();
      document.querySelector('.search-row-2').style.display = st.showExtraSearch === 'yes' ? '' : 'none';

      wirePointerDnD();
    }

    function renderGroupBar(links, active){
      const groups = Array.from(new Set(links.map(l => (l.group||'').trim()).filter(Boolean))).sort();
      groupBar.innerHTML = '';
      groups.forEach(g => {
        const p = document.createElement('div');
        const isActive = g === active;
        p.className = 'pill' + (isActive ? ' active' : '');
        p.textContent = g;
        p.onclick = () => { const st = getSettings(); st.groupFilter = isActive ? 'All' : g; setSettings(st); render(); };
        groupBar.appendChild(p);
      });
    }

    function cardEl(item, globalIndex){
      const el = document.createElement('div');
      el.className = 'card';
      const st = getSettings();
      if (st.lockLayout === 'yes') el.classList.add('locked');
      el.dataset.gindex = globalIndex;
      el.dataset.url = item.url;

      const fav = document.createElement('div'); fav.className = 'favicon';
      const img = document.createElement('img'); img.referrerPolicy = 'no-referrer';
      const letter = (item.title||domainFromUrl(item.url)||'?').slice(0,1).toUpperCase();
      const useMonogram = () => { fav.innerHTML = `<div class="tile-letter">${letter}</div>`; };
      if (item.icon){ img.src = item.icon; img.onerror = useMonogram; fav.appendChild(img); } else { fav.appendChild(img); resolveIcon(item.url, img, useMonogram); }

      const title = document.createElement('div'); title.className = 'title'; title.textContent = item.title || domainFromUrl(item.url) || item.url;
      const desc = document.createElement('div'); desc.className = 'desc'; desc.textContent = item.desc || '';

      const more = document.createElement('div'); more.className = 'more';
      const btn = document.createElement('button'); btn.className = 'icon-btn'; btn.title = 'More'; btn.innerHTML = '<span class="icon">⋮</span>';
      more.appendChild(btn);

      const menu = document.createElement('div'); menu.className = 'menu';
      const mOpen = document.createElement('button'); mOpen.textContent = 'Open in new tab';
      const mEdit = document.createElement('button'); mEdit.textContent = 'Edit shortcut';
      const mRemove = document.createElement('button'); mRemove.textContent = 'Remove';
      const mRefresh = document.createElement('button'); mRefresh.textContent = 'Refresh icon';
      [mOpen, mEdit, mRemove, mRefresh].forEach(b => menu.appendChild(b));

      mOpen.onclick = () => window.open(item.url, '_blank');
      mEdit.onclick = () => openLinkDialog('edit', item, Number(el.dataset.gindex));
      mRemove.onclick = () => { if (confirm('Remove this shortcut?')) removeAt(Number(el.dataset.gindex)); };
      mRefresh.onclick = () => { const cache=getIconCache(); delete cache[domainFromUrl(item.url)]; setIconCache(cache); fav.innerHTML=''; const im=document.createElement('img'); im.referrerPolicy='no-referrer'; fav.appendChild(im); resolveIcon(item.url, im, useMonogram); };
      btn.onclick = (e) => { e.stopPropagation(); document.querySelectorAll('.menu.open').forEach(x => x.classList.remove('open')); menu.classList.toggle('open'); };
      document.addEventListener('click', () => menu.classList.remove('open'));
      el.addEventListener('contextmenu', (e) => { e.preventDefault(); btn.click(); });

      el.append(fav, title, more);
      if (getSettings().showDesc === 'yes' && item.desc) el.appendChild(desc);
      el.appendChild(menu);
      return el;
    }

    function reorderGlobal(from, to, anchor){
      const arr = getLinks();
      const [m] = arr.splice(from, 1);
      if (to > arr.length) to = arr.length;
      if (anchor === 'before' && to > from) to -= 1;
      arr.splice(to, 0, m);
      setLinks(arr);
      render();
    }
    function removeAt(globalIndex){ const arr = getLinks(); arr.splice(globalIndex,1); setLinks(arr); render(); }
    // Rebuild array order from current DOM order of visible cards plus the dragged item.
    function commitOrderFromDOM(dragGIndex, insertPos){
      const st = getSettings();
      const allCards = Array.from(grid.querySelectorAll('.card')); // visible cards, not including placeholder
      const visibleG = allCards.map(c => Number(c.dataset.gindex));
      const newVisible = visibleG.slice();
      // insert dragged global index at the placeholder slot
      newVisible.splice(insertPos, 0, dragGIndex);

      // If All groups are shown, we can directly reorder the whole array by this sequence
      const arr = getLinks();
      if (!st.groupFilter || st.groupFilter === 'All'){
        // Build map gindex -> object reference
        const objects = arr.map(x => x);
        const reordered = newVisible.map(g => objects[g]);
        setLinks(reordered);
        return;
      }

      // Otherwise, reorder only the items of the active group in place, preserving other items.
      const active = st.groupFilter.toLowerCase();
      const objects = arr.map(x => x);
      // Determine which global indices are part of the active group
      const activeIndices = arr.map((x, i) => ((x.group||'').toLowerCase() === active) ? i : -1).filter(i => i >= 0);
      // Filter newVisible to active-only and convert to objects
      const activeNewSequence = newVisible.filter(i => activeIndices.includes(i)).map(i => objects[i]);
      // Now stitch back: walk original arr, and whenever we hit an active index, pull the next from activeNewSequence
      let cursor = 0;
      const result = arr.map((item, idx) => {
        if (activeIndices.includes(idx)){
          const nextObj = activeNewSequence[cursor++];
          return nextObj;
        } else {
          return item;
        }
      });
      setLinks(result);
    }

    // Pointer-based drag and drop with controlled tap-to-open
    function wirePointerDnD(){
      const st = getSettings();
      if (st.lockLayout === 'yes') return;
      const cards = Array.from(grid.querySelectorAll('.card'));
      cards.forEach(card => {
        card.addEventListener('dragstart', ev => ev.preventDefault());
        card.onpointerdown = (e) => onPointerDownCard(e, card);
      });
    }

    let dragState = null;
    let isDropping = false;
    const TAP_THRESHOLD = 4; // px

    function onPointerDownCard(e, card){
      if (e.button !== 0) return;
      if (e.target.closest('.icon-btn') || e.target.closest('.menu')) return;
      e.preventDefault();
      card.setPointerCapture(e.pointerId);
      const rect = card.getBoundingClientRect();
      dragState = { card, startX: e.clientX, startY: e.clientY, grabDX: e.clientX - rect.left, grabDY: e.clientY - rect.top, started: false, ghost: null, placeholder: null };
      card.onpointermove = onPointerMove;
      card.onpointerup = onPointerUp;
      card.onpointercancel = onPointerUp;
    }

    function startDrag(e){
      const { card } = dragState;
      dragState.started = true;
      const ph = document.createElement('div');
      ph.className = 'card placeholder';
      ph.style.height = card.offsetHeight + 'px';
      ph.style.width = card.offsetWidth + 'px';
      card.parentNode.insertBefore(ph, card);
      dragState.placeholder = ph;

      const rect = card.getBoundingClientRect();
      const ghost = card.cloneNode(true);
      ghost.classList.add('drag-layer','dragging');
      ghost.style.width = rect.width + 'px';
      ghost.style.height = rect.height + 'px';
      ghost.style.left = (e.clientX - dragState.grabDX) + 'px';
      ghost.style.top = (e.clientY - dragState.grabDY) + 'px';
      document.body.appendChild(ghost);
      dragState.ghost = ghost;

      card.style.visibility = 'hidden';
    }

    function onPointerMove(e){
      if (!dragState) return;
      const moved = Math.abs(e.clientX - dragState.startX) + Math.abs(e.clientY - dragState.startY);
      if (!dragState.started && moved > TAP_THRESHOLD) startDrag(e);
      if (!dragState.started) return;

      dragState.ghost.style.left = (e.clientX - dragState.grabDX) + 'px';
      dragState.ghost.style.top = (e.clientY - dragState.grabDY) + 'px';

      const target = getTargetSlot(e.clientX, e.clientY);
      const ph = dragState.placeholder;
      if (target.type === 'before') grid.insertBefore(ph, target.node);
      else if (target.type === 'after') grid.insertBefore(ph, target.node.nextSibling);
      else grid.appendChild(ph);
    }

    function getTargetSlot(x, y){
      const cards = Array.from(grid.querySelectorAll('.card')).filter(c => c !== dragState.card && !c.classList.contains('placeholder'));
      if (!cards.length) return { type: 'end', node: null };

      const EPS = 8;
      const rows = [];
      for (const c of cards){
        const r = c.getBoundingClientRect();
        let row = rows.find(R => Math.abs(R.top - r.top) < EPS);
        if (!row){ row = { top: r.top, bottom: r.bottom, items: [] }; rows.push(row); }
        row.items.push({ node: c, rect: r });
      }
      rows.sort((a,b)=>a.top-b.top);
      rows.forEach(row => row.items.sort((a,b)=>a.rect.left-b.rect.left));

      let row = rows.find(R => y >= R.top && y <= R.bottom);
      if (!row){
        row = rows.reduce((best, cur) => {
          const cy = (cur.top + cur.bottom) / 2;
          const d = Math.abs(y - cy);
          return !best || d < best.d ? { ref: cur, d } : best;
        }, null).ref;
      }

      for (const it of row.items){
        const mid = it.rect.left + it.rect.width / 2;
        if (x < mid) return { type: 'before', node: it.node };
      }
      return { type: 'after', node: row.items[row.items.length-1].node };
    }

    function onPointerUp(e){
      if (!dragState) return;
      const { card, placeholder } = dragState;
      card.releasePointerCapture(e.pointerId);
      card.onpointermove = null;
      card.onpointerup = null;
      card.onpointercancel = null;

      const moved = Math.abs(e.clientX - dragState.startX) + Math.abs(e.clientY - dragState.startY);

      if (!dragState.started){
        // Treat as a tap if minimal movement
        card.style.visibility = '';
        dragState = null;
        if (moved <= TAP_THRESHOLD){
          window.open(card.dataset.url, '_blank');
        }
        return;
      }

      isDropping = true;
      setTimeout(() => { isDropping = false; }, 150);

      let toGlobal, anchor;
      const beforeEl = placeholder.nextElementSibling && placeholder.nextElementSibling.classList && placeholder.nextElementSibling.classList.contains('card') ? placeholder.nextElementSibling : null;
      const afterEl = placeholder.previousElementSibling && placeholder.previousElementSibling.classList && placeholder.previousElementSibling.classList.contains('card') ? placeholder.previousElementSibling : null;
      if (beforeEl){ toGlobal = Number(beforeEl.dataset.gindex); anchor = 'before'; }
      else if (afterEl){ toGlobal = Number(afterEl.dataset.gindex) + 1; anchor = 'after'; }
      else { toGlobal = getLinks().length; anchor = 'end'; }

      const fromGlobal = Number(card.dataset.gindex);

      card.style.visibility = '';
      if (dragState.ghost) dragState.ghost.remove();
      if (dragState.placeholder) dragState.placeholder.remove();
      dragState = null;

      reorderGlobal(fromGlobal, toGlobal, anchor);
    }

    if (!localStorage.getItem(LS_KEY)){
      setLinks([
        { url: 'https://www.amazon.com', title: 'Amazon', desc: 'Shopping', group: 'General' },
        { url: 'https://news.google.com', title: 'Google News', desc: 'News', group: 'News' },
        { url: 'https://mail.google.com', title: 'Gmail', desc: 'Mail', group: 'Work' },
        { url: 'https://www.facebook.com', title: 'Facebook', desc: 'Social', group: 'General' },
        { url: 'https://www.linkedin.com', title: 'LinkedIn', desc: 'Professional', group: 'Work' },
        { url: 'https://chat.openai.com', title: 'ChatGPT', desc: 'Assistant', group: 'Work' }
      ]);
    }

    render();
  
    // Ensure a visible version label in Settings every time it opens
    function ensureVersionLabel(){
      const dlg = document.getElementById('settingsDialog');
      if (!dlg) return;
      // Footer badge only, to match your UX
      const sheet = dlg.querySelector('.sheet');
      if (sheet){
        let actionsRow = sheet.querySelector('.actions-row');
        if (!actionsRow){
          const actions = sheet.querySelector('.actions');
          if (actions){
            actionsRow = document.createElement('div');
            actionsRow.className = 'actions-row';
            const left = document.createElement('div');
            left.className = 'version-left';
            left.id = 'versionFooter';
            left.textContent = `${APP_NAME} ${VERSION}`;
            const right = document.createElement('div');
            right.className = 'actions-right';
            while (actions.firstChild){
              right.appendChild(actions.firstChild);
            }
            actions.replaceWith(actionsRow);
            actionsRow.appendChild(left);
            actionsRow.appendChild(right);
          }
        } else {
          const vf = sheet.querySelector('#versionFooter');
          if (vf) vf.textContent = `${APP_NAME} ${VERSION}`;
        }
      }
    }

  </script>

<!-- Bing wallpaper support (non-invasive) -->
<script>
(function(){
  const WP_EL = document.getElementById('wallpaper');

  async function fetchBingDailyUrl(mkt){
    const market = (mkt || 'en-US').trim();
    const resp = await fetch(`https://www.bing.com/HPImageArchive.aspx?format=js&idx=0&n=1&mkt=${encodeURIComponent(market)}`);
    const data = await resp.json();
    let u = data && data.images && data.images[0] && data.images[0].url;
    if (!u) throw new Error('No image from Bing');
    if (u.startsWith('/')) u = 'https://www.bing.com' + u;
    if (!/[?&](w|h)=/i.test(u) && !/UHD\.jpg/i.test(u)){
      const w = Math.max(1280, window.innerWidth || 1920);
      const h = Math.max(720, window.innerHeight || 1080);
      u += (u.includes('?') ? '&' : '?') + `w=${w}&h=${h}`;
    }
    return u;
  }

  function preload(url){
    return new Promise((res, rej) => {
      const img = new Image();
      img.referrerPolicy = 'no-referrer';
      img.onload = () => res(url);
      img.onerror = rej;
      img.src = url;
    });
  }

  function setBg(url){
    if (!WP_EL) { document.body.style.backgroundImage = `url('${url}')`; document.body.style.backgroundSize = 'cover'; document.body.style.backgroundPosition = 'center center'; document.body.style.backgroundAttachment = 'fixed'; return; }
    WP_EL.style.background = 'none';
    WP_EL.style.backgroundImage = `url('${url}')`;
    WP_EL.style.backgroundSize = 'cover';
    WP_EL.style.backgroundPosition = 'center center';
    WP_EL.style.backgroundAttachment = 'fixed';
  }

  // Keep original
  const _applyWallpaper = window.applyWallpaper;

  window.applyWallpaper = async function(){
    try{
      const st = (typeof getSettings === 'function') ? getSettings() : null;
      const raw = (st && st.value || '').trim();
      if (st && (st.mode === 'bing' || (st.mode === 'unsplash' && /^bing:/i.test(raw)))){
        const locale = st.mode === 'bing' ? (raw || 'en-US') : (raw.split(':')[1] || 'en-US');
        const url = await fetchBingDailyUrl(locale);
        const ready = await preload(url);
        setBg(ready);
        return;
      }
    }catch(e){
      console.warn('Bing wallpaper failed, falling back:', e);
    }
    // Fallback to original
    if (typeof _applyWallpaper === 'function'){ return _applyWallpaper(); }
  };

  // Run once on load in case settings already request Bing
  document.addEventListener('DOMContentLoaded', () => { if (typeof window.applyWallpaper === 'function') window.applyWallpaper(); });
})();
</script>
